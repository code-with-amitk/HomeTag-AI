[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hometag-ai"
version = "0.1.0"
description = "HomeTag AI API and background worker"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.13,<2",
    "celery[redis]>=5.4,<6",
    "email-validator>=2,<3",
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "pgvector>=0.3,<1",
    "pwdlib[argon2]>=0.2,<1",
    "psycopg[binary]>=3.2,<4",
    "PyJWT>=2.9,<3",
    "python-multipart>=0.0.12,<1",
    "pydantic-settings>=2.6,<3",
    "python-dotenv>=1,<2",
    "redis>=5,<7",
    "sqlalchemy>=2,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.13,<2",
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/api/routes/*.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true
