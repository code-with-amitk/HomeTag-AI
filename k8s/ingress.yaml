apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hometag
  namespace: hometag
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hometag-api
                port:
                  number: 8000
